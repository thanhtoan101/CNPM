name: Deploy AI service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment and Azure target
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      container_image:
        description: Immutable registry image reference, preferably image@sha256:digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: film-ai-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image
        id: deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: film-ai-${{ github.run_id }}-${{ github.run_attempt }}
          scope: resourceGroup
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: infra/azure/main.bicep
          parameters: |
            environmentName: ${{ inputs.environment }}
            containerImage: ${{ inputs.container_image }}
            registryServer: ${{ vars.AZURE_CONTAINER_REGISTRY_SERVER }}
            registryPullIdentityResourceId: ${{ vars.AZURE_REGISTRY_PULL_IDENTITY_ID }}
          bicep-version: 0.46.1
      - name: Record internal deployment endpoint
        run: echo "Internal service endpoint created for network-connected smoke tests."
