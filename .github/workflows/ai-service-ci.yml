name: AI service CI

on:
  push:
    paths:
      - "ai_service/**"
      - "tests/**"
      - "scripts/**"
      - "infra/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ai-service-ci.yml"
      - ".github/workflows/ai-service-deploy.yml"
  pull_request:
    paths:
      - "ai_service/**"
      - "tests/**"
      - "scripts/**"
      - "infra/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ai-service-ci.yml"
      - ".github/workflows/ai-service-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q ai_service scripts tests
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build deployable image
        run: docker build --tag film-community-ai:${{ github.sha }} .
      - name: Verify image runs as non-root
        run: test "$(docker run --rm film-community-ai:${{ github.sha }} id -u)" != "0"
      - name: Start container
        run: docker run --detach --name film-ai-ci --publish 8080:8080 film-community-ai:${{ github.sha }}
      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready > /dev/null; then
              test "$(docker inspect --format='{{.State.Health.Status}}' film-ai-ci)" != "unhealthy"
              exit 0
            fi
            sleep 1
          done
          docker logs film-ai-ci
          exit 1
      - name: Run container smoke test
        run: python -m scripts.smoke_test http://127.0.0.1:8080
      - name: Show container logs on failure
        if: failure()
        run: docker logs film-ai-ci
      - name: Stop container
        if: always()
        run: docker rm --force film-ai-ci

  validate-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.46.1
      - name: Compile Azure Bicep template
        run: az bicep build --file infra/azure/main.bicep
