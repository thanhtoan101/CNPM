[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-community-ai-service"
version = "0.1.0"
description = "Explainable recommendation, retrieval and scan-quality prototypes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
include = ["ai_service*"]

[tool.setuptools.package-data]
ai_service = ["data/*.json", "openapi.json"]
